<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetView - P45</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- menu bar -->
<div class="menubar" id="menubar">
  <button class="only-narrow navbtn" id="nav-toggle">Nodes</button>
  <span class="appname">NetView</span>
  <div class="menu" data-menu="lab"><button>Lab</button></div>
  <div class="menu" data-menu="view"><button>View</button></div>
  <div class="menu" data-menu="tools"><button>Tools</button></div>
  <span class="labname">P45 estate</span>
  <span class="grow"></span>
  <span class="menu-note" id="lab-state">loading</span>
  <button class="menu-btn" id="refresh-btn" title="Re-read everything from CML now (R)">Refresh from CML</button>
</div>

<div class="infobar" id="banners" hidden></div>
<div class="dz-banner" id="disaster-banner" role="status" hidden></div>
<div class="pickbar" id="pickbar" hidden></div>

<div class="work">
  <aside class="nodes" id="nodes-panel">
    <div class="nl-head">
      <input type="search" id="q" placeholder="Find node, IP, name, VLAN (/)">
      <select id="site" title="Site">
        <option value="all">All sites</option>
        <option value="HQ">HQ</option>
        <option value="DR">DR</option>
        <option value="other">Carrier / home</option>
      </select>
    </div>
    <div class="nlist" id="nlist"></div>
  </aside>

  <div class="center">
    <section class="pathview">
      <div class="path-head" id="path-head"></div>
      <div class="path-body" id="path-body"></div>
    </section>

    <div class="splitter" id="splitter"></div>

    <section class="pane" id="pane">
      <div class="pane-tabs" id="pane-tabs"></div>
      <div class="pane-body" id="pane-body"></div>
    </section>
  </div>

  <aside class="side" id="side">
    <div class="side-tabs" id="side-tabs"></div>
    <div class="side-body" id="side-body"></div>
  </aside>
</div>

<div class="statusbar">
  <span id="src-line"></span>
  <span id="counts"></span>
  <span id="harvest-line" class="s-warn"></span>
  <span class="grow"></span>
  <span id="sel-line"></span>
  <span>Next refresh <span id="tick"></span></span>
  <button class="linkish" id="pause">Pause</button>
</div>

<div class="ctxmenu" id="ctxmenu" hidden></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
<script src="{{ url_for('static', filename='disaster.js') }}"></script>
</body>
</html>
