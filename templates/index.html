<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NetView - P45</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- menu bar -->
<div class="menubar" id="menubar">
  <span class="appname">NetView</span>
  <div class="menu" data-menu="lab"><button>Lab</button></div>
  <div class="menu" data-menu="view"><button>View</button></div>
  <div class="menu" data-menu="tools"><button>Tools</button></div>
  <span class="labname">P45 estate</span>
  <span class="grow"></span>
  <span class="menu-note" id="lab-state">loading</span>
</div>

<!-- toolbar -->
<div class="toolbar">
  <button id="zoom-fit" title="Fit lab to window (F)">Fit</button>
  <button id="zoom-in" title="Zoom in">Zoom in</button>
  <button id="zoom-out" title="Zoom out">Zoom out</button>
  <span class="tsep"></span>
  <span class="tlabel">Show</span>
  <label><input type="checkbox" id="show-ip" checked>Addresses</label>
  <label><input type="checkbox" id="show-if">Interfaces</label>
  <label><input type="checkbox" id="show-traffic">Link traffic</label>
  <span class="grow"></span>
  <label class="tlabel" for="site">Site</label>
  <select id="site">
    <option value="all">All</option>
    <option value="HQ">HQ</option>
    <option value="DR">DR</option>
    <option value="other">Carrier / home</option>
  </select>
  <input type="search" id="q" placeholder="Find node, IP, name, VLAN (/)">
</div>

<div class="infobar" id="banners" hidden></div>

<div class="work">
  <div class="center">
    <div class="canvas-wrap">
      <svg id="canvas" class="canvas" tabindex="0" aria-label="Lab topology">
        <defs>
          <pattern id="grid-s" width="20" height="20" patternUnits="userSpaceOnUse">
            <path d="M20 0H0V20" class="grid-s"/>
          </pattern>
          <pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse">
            <rect width="100" height="100" fill="url(#grid-s)"/>
            <path d="M100 0H0V100" class="grid-l"/>
          </pattern>
        </defs>
        <rect class="canvas-bg" width="100%" height="100%" fill="url(#grid)"/>
        <g id="viewport">
          <g id="links"></g>
          <g id="overlay"></g>
          <g id="nodes"></g>
        </g>
      </svg>
      <div class="zoomread" id="zoomread"></div>
    </div>

    <div class="splitter" id="splitter"></div>

    <section class="pane" id="pane">
      <div class="pane-tabs" id="pane-tabs"></div>
      <div class="pane-body" id="pane-body"></div>
    </section>
  </div>

  <aside class="side" id="side">
    <div class="side-tabs" id="side-tabs"></div>
    <div class="side-body" id="side-body"></div>
  </aside>
</div>

<div class="statusbar">
  <span id="src-line"></span>
  <span id="counts"></span>
  <button class="linkish" id="hidden-btn" hidden></button>
  <span class="grow"></span>
  <span id="sel-line"></span>
  <span>Next refresh <span id="tick"></span></span>
  <button class="linkish" id="pause">Pause</button>
</div>

<div class="ctxmenu" id="ctxmenu" hidden></div>

<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
